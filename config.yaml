# LexiTrace Phase 1 configuration.
# Freeze these settings before running controlled Phase 2 experiments.
# Keep the same models, prompts, chunking and generation settings across conditions.

asr:
  model: large-v3
  device: cpu
  compute_type: int8
  language: en
  beam_size: 5

summarisation:
  model: google/flan-t5-base
  device: auto
  max_input_tokens: 512
  max_new_tokens: 256
  chunk_words: 180

translation:
  model: facebook/nllb-200-distilled-600M
  device: auto
  source_language_code: eng_Latn
  max_input_tokens: 512
  max_new_tokens: 512

target_languages:
  ur:
    name: Urdu
    code: urd_Arab
  ks:
    name: Kashmiri (Perso-Arabic script)
    code: kas_Arab
  hi:
    name: Hindi
    code: hin_Deva
  kn:
    name: Kannada
    code: kan_Knda

# BASELINE prompts are deliberately NEUTRAL:
# - no instruction to fix ASR errors (we want to measure implicit recovery)
# - no instruction about how to handle technical terms (that is a later intervention)
prompts:
  summarise: |
    You are given a segment of a lecture transcript. Write concise study notes
    for a student, in English, as short bullet points covering the main ideas.
    Output only the notes.

    Transcript segment:
    {text}
